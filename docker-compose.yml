version: '3.8'

services:
  civitas-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civitas-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - CACHE_TTL_SECONDS=86400
      - ENABLE_TELEGRAM_BOT=${ENABLE_TELEGRAM_BOT:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    volumes:
      - ./backend/app/assets:/app/app/assets
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

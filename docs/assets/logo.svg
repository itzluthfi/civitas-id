<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#001f54"/>
      <stop offset="100%" stop-color="#034078"/>
    </linearGradient>

    <!-- Cyan / Sky Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Shield Glow Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Heraldic Credential Shield -->
  <path d="M 256,92 C 340,92 376,128 376,212 C 376,310 256,380 256,380 C 256,380 136,310 136,212 C 136,128 172,92 256,92 Z"
        fill="url(#shieldGrad)" stroke="url(#cyanGrad)" stroke-width="6"/>

  <!-- Academic Mortarboard / Toga Cap Top -->
  <!-- Diamond Cap Plane -->
  <polygon points="256,140 354,186 256,232 158,186" fill="url(#cyanGrad)" filter="url(#glow)"/>
  
  <!-- Cap Skull Base -->
  <path d="M 194,210 L 194,248 C 194,276 318,276 318,248 L 318,210 Z" fill="#001f54" stroke="url(#cyanGrad)" stroke-width="4"/>

  <!-- Cap Tassel with Gold Button & Pendant -->
  <circle cx="256" cy="186" r="7" fill="url(#goldGrad)"/>
  <path d="M 256,186 Q 330,195 348,242" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <rect x="342" y="242" width="12" height="24" rx="3" fill="url(#goldGrad)"/>

  <!-- Digital Credential ID Card Icon in Center of Shield -->
  <g transform="translate(186, 260)">
    <!-- ID Card Base -->
    <rect x="0" y="0" width="140" height="90" rx="12" fill="#0b172a" stroke="url(#cyanGrad)" stroke-width="3.5" filter="url(#shadow)"/>
    <!-- Photo Area -->
    <rect x="14" y="18" width="34" height="44" rx="6" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <!-- Student Avatar Silhouette -->
    <circle cx="31" cy="34" r="8" fill="#38bdf8"/>
    <path d="M 19,56 C 19,47 43,47 43,56 Z" fill="#38bdf8"/>
    <!-- Smart Chip Badge -->
    <rect x="58" y="20" width="22" height="15" rx="3" fill="url(#goldGrad)"/>
    <!-- Data Lines -->
    <rect x="58" y="42" width="68" height="6" rx="3" fill="#ffffff" opacity="0.9"/>
    <rect x="58" y="54" width="48" height="5" rx="2.5" fill="#38bdf8" opacity="0.8"/>
    <!-- Verified Holographic Checkmark Seal -->
    <circle cx="120" cy="70" r="14" fill="#059669" stroke="#ffffff" stroke-width="2"/>
    <path d="M 115,70 L 118,74 L 126,65" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stars of Excellence & Verification -->
  <polygon points="256,412 260,422 271,422 262,428 265,438 256,432 247,438 250,428 241,422 252,422" fill="url(#goldGrad)"/>
  <polygon points="214,402 217,410 226,410 219,415 221,423 214,418 207,423 209,415 202,410 211,410" fill="url(#goldGrad)" opacity="0.8"/>
  <polygon points="298,402 301,410 310,410 303,415 305,423 298,418 291,423 293,415 286,410 295,410" fill="url(#goldGrad)" opacity="0.8"/>
</svg>
